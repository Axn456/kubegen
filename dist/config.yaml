version: 2
project_name: gangplank
release:
  github:
    owner: sighupio
    name: gangplank
  prerelease: auto
  name_template: '{{ .Tag }}'
builds:
  - id: gangplank
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    go386:
      - sse2
    goarm:
      - "6"
    goarm64:
      - v8.0
    gomips:
      - hardfloat
    goppc64:
      - power8
    goriscv64:
      - rva20u64
    targets:
      - linux_amd64_v1
      - linux_arm64_v8.0
    dir: .
    main: ./cmd/gangplank
    binary: gangplank
    builder: go
    tool: go
    command: build
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
    env:
      - CGO_ENABLED=0
archives:
  - id: default
    builds_info:
      mode: 493
    name_template: '{{ tolower .ProjectName }}-{{ tolower .Os }}-{{ tolower .Arch }}'
    formats:
      - tar.gz
    files:
      - src: license*
      - src: LICENSE*
      - src: readme*
      - src: README*
      - src: changelog*
      - src: CHANGELOG*
srpm:
  nfpmrpm: {}
  package_name: gangplank
  file_name_template: '{{ .PackageName }}-{{ .Version }}.src.rpm'
  bins:
    gangplank: '%{goipath}'
snapshot:
  version_template: '{{ incpatch .Version }}-develop'
checksum:
  name_template: checksums.txt
  algorithm: sha256
docker_digest:
  name_template: digests.txt
changelog:
  filters:
    exclude:
      - '^docs:'
      - '^test:'
  sort: asc
  use: github-native
  format: '{{ .SHA }}: {{ .Message }} ({{ with .AuthorUsername }}@{{ . }}{{ else }}{{ .AuthorName }} <{{ .AuthorEmail }}>{{ end }})'
dist: dist
docker_signs:
  - id: default
    cmd: cosign
    args:
      - sign
      - --key=env://COSIGN_KEY
      - --upload=true
      - ${artifact}
      - --yes
    artifacts: all
    stdin: '{{ .Env.COSIGN_PWD }}'
env_files:
  github_token: ~/.config/goreleaser/github_token
  gitlab_token: ~/.config/goreleaser/gitlab_token
  gitea_token: ~/.config/goreleaser/gitea_token
before:
  hooks:
    - go mod tidy
source:
  name_template: '{{ .ProjectName }}-{{ .Version }}'
  format: tar.gz
gomod:
  gobinary: go
announce:
  twitter:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  mastodon:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    server: ""
  reddit:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    url_template: '{{ .ReleaseURL }}'
  slack:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: GoReleaser
  discord:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    author: GoReleaser
    color: "3888754"
    icon_url: https://goreleaser.com/static/avatar.png
  teams:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    color: '#2D313E'
    icon_url: https://goreleaser.com/static/avatar.png
  smtp:
    subject_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    body_template: 'You can view details from: {{ .ReleaseURL }}'
  mattermost:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    color: '#2D313E'
    username: GoReleaser
  linkedin:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  telegram:
    message_template: '{{ print .ProjectName " " .Tag " is out! Check it out at " .ReleaseURL | mdv2escape }}'
    parse_mode: MarkdownV2
  webhook:
    message_template: '{ "message": "{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}"}'
    content_type: application/json; charset=utf-8
    expected_status_codes:
      - 200
      - 201
      - 202
      - 204
  opencollective:
    title_template: '{{ .Tag }}'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out!<br/>Check it out at <a href="{{ .ReleaseURL }}">{{ .ReleaseURL }}</a>'
  bluesky:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  discourse:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: system
git:
  tag_sort: -version:refname
mcp:
  name: ""
  title: ""
  auth:
    type: none
retry:
  attempts: 10
  delay: 10s
  max_delay: 5m0s
github_urls:
  download: https://github.com
gitlab_urls:
  download: https://gitlab.com
dockers:
  - goos: linux
    goarch: amd64
    goarm: "6"
    goamd64: v1
    dockerfile: Dockerfile
    image_templates:
      - registry.sighup.io/fury/gangplank-amd64:latest
      - registry.sighup.io/fury/gangplank-amd64:{{ .Major }}
      - registry.sighup.io/fury/gangplank-amd64:{{ .Major }}.{{ .Minor }}
      - registry.sighup.io/fury/gangplank-amd64:{{ .Major }}.{{ .Minor }}.{{ .Patch }}
    skip_push: auto
    build_flag_templates:
      - --platform=linux/amd64
    use: docker
    retry:
      attempts: 10
      delay: 10s
      max_delay: 5m0s
  - goos: linux
    goarch: amd64
    goarm: "6"
    goamd64: v1
    dockerfile: Dockerfile
    image_templates:
      - registry.sighup.io/fury/gangplank-amd64:{{ .Tag }}
    skip_push: "false"
    build_flag_templates:
      - --platform=linux/amd64
    use: docker
    retry:
      attempts: 10
      delay: 10s
      max_delay: 5m0s
  - goos: linux
    goarch: arm64
    goarm: "6"
    goamd64: v1
    dockerfile: Dockerfile
    image_templates:
      - registry.sighup.io/fury/gangplank-arm64:latest
      - registry.sighup.io/fury/gangplank-arm64:{{ .Major }}
      - registry.sighup.io/fury/gangplank-arm64:{{ .Major }}.{{ .Minor }}
      - registry.sighup.io/fury/gangplank-arm64:{{ .Major }}.{{ .Minor }}.{{ .Patch }}
    skip_push: auto
    build_flag_templates:
      - --platform=linux/arm64
    use: docker
    retry:
      attempts: 10
      delay: 10s
      max_delay: 5m0s
  - goos: linux
    goarch: arm64
    goarm: "6"
    goamd64: v1
    dockerfile: Dockerfile
    image_templates:
      - registry.sighup.io/fury/gangplank-arm64:{{ .Tag }}
    skip_push: "false"
    build_flag_templates:
      - --platform=linux/arm64
    use: docker
    retry:
      attempts: 10
      delay: 10s
      max_delay: 5m0s
docker_manifests:
  - name_template: registry.sighup.io/fury/gangplank:latest
    skip_push: auto
    image_templates:
      - registry.sighup.io/fury/gangplank-amd64:latest
      - registry.sighup.io/fury/gangplank-arm64:latest
    use: docker
    retry:
      attempts: 10
      delay: 10s
      max_delay: 5m0s
  - name_template: registry.sighup.io/fury/gangplank:{{ .Major }}
    skip_push: auto
    image_templates:
      - registry.sighup.io/fury/gangplank-amd64:{{ .Major }}
      - registry.sighup.io/fury/gangplank-arm64:{{ .Major }}
    use: docker
    retry:
      attempts: 10
      delay: 10s
      max_delay: 5m0s
  - name_template: registry.sighup.io/fury/gangplank:{{ .Major }}.{{ .Minor }}
    skip_push: auto
    image_templates:
      - registry.sighup.io/fury/gangplank-amd64:{{ .Major }}.{{ .Minor }}
      - registry.sighup.io/fury/gangplank-arm64:{{ .Major }}.{{ .Minor }}
    use: docker
    retry:
      attempts: 10
      delay: 10s
      max_delay: 5m0s
  - name_template: registry.sighup.io/fury/gangplank:{{ .Major }}.{{ .Minor }}.{{ .Patch }}
    skip_push: auto
    image_templates:
      - registry.sighup.io/fury/gangplank-amd64:{{ .Major }}.{{ .Minor }}.{{ .Patch }}
      - registry.sighup.io/fury/gangplank-arm64:{{ .Major }}.{{ .Minor }}.{{ .Patch }}
    use: docker
    retry:
      attempts: 10
      delay: 10s
      max_delay: 5m0s
  - name_template: registry.sighup.io/fury/gangplank:{{ .Tag }}
    image_templates:
      - registry.sighup.io/fury/gangplank-amd64:{{ .Tag }}
      - registry.sighup.io/fury/gangplank-arm64:{{ .Tag }}
    use: docker
    retry:
      attempts: 10
      delay: 10s
      max_delay: 5m0s
